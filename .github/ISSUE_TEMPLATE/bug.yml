name: Bug report
description: Something Placebo did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Terminal output or the relevant part of trial.json. Remove anything private.
      render: shell
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `placebo --version` and `placebo doctor`, plus your OS.
    validations:
      required: true
