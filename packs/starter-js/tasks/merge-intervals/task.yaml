title: mergeIntervals gives wrong answers
kind: bug
prompt: |
  Bug report: `mergeIntervals` in `src/intervals.mjs` gives wrong answers.

  - It assumes the input is sorted: `[[5,6],[1,2]]` comes back unsorted and unmerged.
  - It does not merge intervals that only touch: `[1,2]` and `[2,3]` should become `[1,3]`.
  - When one interval contains another it can shrink the result: `[[1,10],[2,3]]` returns `[[1,3]]`.

  The output should be sorted by start. It must not modify the array it was given.
hidden:
  - test/intervals.test.mjs
